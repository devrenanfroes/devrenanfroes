                        Total Contributions
                    </text>
                </g>

                <!-- Total Contributions range -->
                <g transform='translate(126.66666666667, 125.5)'>
                    <text x='0' y='32' stroke-width='0' text-anchor='middle' fill='#737373' stroke='none' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='400' font-size='12px' font-style='normal' style='opacity: 1; opacity: 1;'>
