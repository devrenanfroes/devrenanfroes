                    </text>
                </g>

                <!-- Longest Streak label -->
                <g transform='translate(633.33333333333, 95.5)'>
                    <text x='0' y='32' stroke-width='0' text-anchor='middle' fill='#a3a3a3' stroke='none' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='700' font-size='14px' font-style='normal' style='opacity: 1; opacity: 1;'>
