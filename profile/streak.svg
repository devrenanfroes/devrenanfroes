<svg xmlns='http://www.w3.org/2000/svg' xmlns:xlink='http://www.w3.org/1999/xlink'
                style='isolation: isolate' viewBox='0 0 760 190' width='760px' height='190px' direction='ltr'>
        
        <defs>
            <clipPath id='outer_rectangle'>
                <rect width='760' height='190' rx='8'/>
            </clipPath>
            <mask id='mask_out_ring_behind_fire'>
                <rect width='760' height='190' fill='white'/>
                <ellipse id='mask-ellipse' cx='633.33333333333' cy='32' rx='13' ry='18' fill='black'/>
            </mask>
            
        </defs>
        <g clip-path='url(#outer_rectangle)'>
            <g style='isolation: isolate'>
                <rect stroke='#2a2a2a' fill='#0d1117' rx='8' x='0.5' y='0.5' width='759' height='189'/>
            </g>
            <g style='isolation: isolate'>
                <line x1='253.33333333333' y1='26.75' x2='253.33333333333' y2='167.5' vector-effect='non-scaling-stroke' stroke-width='1' stroke='#2a2a2a' stroke-linejoin='miter' stroke-linecap='square' stroke-miterlimit='3'/>
                <line x1='506.66666666667' y1='26.75' x2='506.66666666667' y2='167.5' vector-effect='non-scaling-stroke' stroke-width='1' stroke='#2a2a2a' stroke-linejoin='miter' stroke-linecap='square' stroke-miterlimit='3'/>
            </g>
            <g style='isolation: isolate'>
                <!-- Total Contributions big number -->
                <g transform='translate(126.66666666667, 45.5)'>
                    <text x='0' y='32' stroke-width='0' text-anchor='middle' fill='#f5f5f5' stroke='none' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='700' font-size='28px' font-style='normal' style='opacity: 1; opacity: 1;'>
                        1,146
                    </text>
                </g>

                <!-- Total Contributions label -->
                <g transform='translate(126.66666666667, 95.5)'>
