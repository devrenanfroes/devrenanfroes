                <g transform='translate(380, 45.5)'>
                    <text x='0' y='32' stroke-width='0' text-anchor='middle' fill='#f5f5f5' stroke='none' font-family='"Segoe UI", Ubuntu, sans-serif' font-weight='700' font-size='28px' font-style='normal' style='font-size: 28px;'>
                        42
                    </text>
                </g>

            </g>
            <g style='isolation: isolate'>
